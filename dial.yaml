packages:
  defaults:    !include src/main/defaults.yaml
  hardware:    !include src/main/hardware.yaml
  entities:      !include src/main/entities.yaml
  entities_demo: !include src/main/entities_demo.yaml
  dial_lights_sensors: !include src/main/dial_lights_sensors.yaml
  dial_switches_fans_sensors: !include src/main/dial_switches_fans_sensors.yaml
  load_page:   !include src/pages/load.yaml
  clock_page:  !include src/pages/main.yaml
  menu_page:   !include src/pages/menu.yaml
  light_page:  !include src/pages/light.yaml
  light_selector_page: !include src/pages/light_selector.yaml
  switches_page: !include src/pages/switches.yaml
  switches_selector_page: !include src/pages/switches_selector.yaml
  fan_page:      !include src/pages/fan.yaml
  air_page:    !include src/pages/air.yaml
  music_page:  !include src/pages/music.yaml
  timer_page:  !include src/pages/timer.yaml
  idle:        !include src/main/idle.yaml

external_components:
      - source: github://rorshanks/m5stack-dial-home-assistant@main
        components: [dial_lights, dial_carousel, dial_switches, dial_fans]
        refresh: 0s

dial_lights:
  - entity_id: light.dummy_light
    name: Dummy Light
    state_sensor: dial_light_dummy_light_state
    modes_sensor: dial_light_dummy_light_modes
    brightness_sensor: dial_light_dummy_light_brightness
    color_sensor: dial_light_dummy_light_rgb
    color_mode_sensor: dial_light_dummy_light_color_mode
    color_temp_kelvin_sensor: dial_light_dummy_light_color_temp_kelvin
    min_color_temp_kelvin_sensor: dial_light_dummy_light_min_color_temp_kelvin
    max_color_temp_kelvin_sensor: dial_light_dummy_light_max_color_temp_kelvin
  

dial_switches:
      - entity_id: switch.dummy_switch
        name: Dummy Switch
        state_sensor: dial_switch_dummy_switch_state

dial_fans:
      - entity_id: fan.dummy_fan
        name: Dummy Fan
        state_sensor: dial_fan_dummy_fan_state
        percentage_sensor: dial_fan_dummy_fan_percentage
        direction_sensor: dial_fan_dummy_fan_direction
        lid_entity_id: cover.dummy_fan_lid
        lid_state_sensor: dial_dummy_fan_lid_state

substitutions:
  timezone: America/Los_Angeles 
  light_entity: light.dummy_light
  ## Remote packages cannot resolve !secret themselves. Set these from the
  # consumer configuration (usually with !secret values in that local file).
  device_name: m5stack-dialv1
  device_friendly_name: M5Stack Dial
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_ssid: Dial Fallback Hotspot
  ap_password: change-me-fallback-password
  # Real key lives in secrets.yaml (gitignored) on the deploy target, not here.
  api_encryption_key: !secret api_encryption_key
  ota_password: change-me-ota-password
  screen_dim_timeout: 45s
  screen_return_timeout: 5min
  screen_off_timeout: 30min
  screen_dim_brightness: "20%"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  on_boot:
    - priority: 800
      then:
        - switch.turn_on: power_hold
    - priority: -100
      then:
        - pcf8563.read_time:
        - light.turn_on:
            id: display_backlight
            brightness: 100%
        - script.execute: update_loading_page

esp32:
  board: m5stack-stamps3
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BROWNOUT_DET: "n"

logger:
  level: INFO

api:
  encryption:
    key: ${api_encryption_key}
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - script.execute: on_ha_connected
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - globals.set:
              id: ha_connected
              value: 'false'

ota:
  - platform: esphome
    password: ${ota_password}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}

captive_portal:

globals:
  - id: ha_connected
    type: bool
    initial_value: 'false'

image:
  - file: src/assets/images/logo.png
    id: logo_img
    type: RGB565
    transparency: alpha_channel
    resize: 72x72
  - file: src/assets/images/scene.png
    id: img_scene
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/bulb.png
    id: img_light
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/ac.png
    id: img_ac
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/music.png
    id: img_music
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/palette.png
    id: img_palette
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/brightness.png
    id: img_brightness
    type: RGB565
    transparency: alpha_channel
    resize: 24x24
  - file: src/assets/images/light.png
    id: img_dengguang
    type: RGB565
    transparency: alpha_channel
    resize: 24x24

color:
  - id: col_bg
    hex: "050812"
  - id: col_text_pri
    hex: "EEF2FF"
  - id: col_text_sec
    hex: "6B7FCC"

lvgl:
  displays:
    - round_display
  touchscreens:
    - touch
  encoders:
    - sensor: encoder
      enter_button: front_button
  buffer_size: "12%"
  color_depth: 16
  bg_color: col_bg
  default_font: font_lbl
