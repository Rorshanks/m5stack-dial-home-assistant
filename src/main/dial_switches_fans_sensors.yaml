text_sensor:
  - platform: homeassistant
    id: dial_switch_relay1_state
    entity_id: switch.waveshare_relay_1
    internal: true
    on_value:
      - script.execute: menu_on_ha_update

  - platform: homeassistant
    id: dial_switch_relay2_state
    entity_id: switch.waveshare_relay_2
    internal: true
    on_value:
      - script.execute: menu_on_ha_update

  - platform: homeassistant
    id: dial_switch_pump_state
    entity_id: switch.water_pump
    internal: true
    on_value:
      - script.execute: menu_on_ha_update

  - platform: homeassistant
    id: dial_fan_ceiling_state
    entity_id: fan.living_room_ceiling_fan
    internal: true
    on_value:
      - script.execute: menu_on_ha_update

  - platform: homeassistant
    id: dial_fan_vent_state
    entity_id: fan.maxxair_fan_control_maxxair_fan
    internal: true
    on_value:
      - script.execute: menu_on_ha_update

  - platform: homeassistant
    id: dial_fan_vent_direction
    entity_id: fan.maxxair_fan_control_maxxair_fan
    attribute: direction
    internal: true

  - platform: homeassistant
    id: dial_fan_lid_state
    entity_id: cover.maxxair_fan_control_lid
    internal: true

sensor:
  - platform: homeassistant
    id: dial_fan_ceiling_percentage
    entity_id: fan.living_room_ceiling_fan
    attribute: percentage
    internal: true
    on_value:
      - script.execute: menu_on_ha_update

  - platform: homeassistant
    id: dial_fan_vent_percentage
    entity_id: fan.maxxair_fan_control_maxxair_fan
    attribute: percentage
    internal: true
    on_value:
      - script.execute: menu_on_ha_update

  # Optional -- only include if your MaxxFan lid reports a numeric position (0-100).
  # If it's open/closed only, leave this commented out along with the
  # lid_position_sensor line in dial.yaml's dial_fans: entry.
  #- platform: homeassistant
  #  id: dial_fan_vent_lid_position
  #  entity_id: cover.maxxair_fan_control_lid
  #  attribute: current_position
  #  internal: true
