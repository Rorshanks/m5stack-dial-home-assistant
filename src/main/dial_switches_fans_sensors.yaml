text_sensor:
  - platform: homeassistant
    id: dial_switch_dummy_switch_state
    entity_id: switch.dummy_switch
    internal: true
    on_value:
      - script.execute: menu_on_ha_update

  - platform: homeassistant
    id: dial_fan_dummy_fan_state
    entity_id: fan.dummy_fan
    internal: true
    on_value:
      - script.execute: menu_on_ha_update

  - platform: homeassistant
    id: dial_fan_dummy_fan_direction
    entity_id: fan.dummy_fan
    attribute: direction
    internal: true

  - platform: homeassistant
    id: dial_fan_dummy_fan_cover_state
    entity_id: cover.dummy_fan_cover
    internal: true

sensor:
  - platform: homeassistant
    id: dial_fan_dummy_fan_percentage
    entity_id: fan.dummy_fan
    attribute: percentage
    internal: true
    on_value:
      - script.execute: menu_on_ha_update

  # Optional -- only include if your MaxxFan lid reports a numeric position (0-100).
  # If it's open/closed only, leave this commented out along with the
  # lid_position_sensor line in dial.yaml's dial_fans: entry.
  #- platform: homeassistant
  #  id: dial_fan_dummy_fan_cover_position
  #  entity_id: cover.dummy_fan_cover
  #  attribute: current_position
  #  internal: true
